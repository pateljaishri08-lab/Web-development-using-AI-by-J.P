<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="600" fill="#f8f9fa"/>
  
  <!-- Abstract Tech Patterns -->
  <circle cx="1000" cy="100" r="150" fill="#4EB578" fill-opacity="0.05"/>
  <circle cx="1100" cy="500" r="200" fill="#4EB578" fill-opacity="0.08"/>
  
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4EB578" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#grid)" />

  <!-- Animated-style Nodes and Lines -->
  <g stroke="#4EB578" stroke-width="2" stroke-opacity="0.2">
    <line x1="100" y1="100" x2="300" y2="200" />
    <line x1="300" y1="200" x2="250" y2="400" />
    <line x1="250" y1="400" x2="500" y2="350" />
    <line x1="500" y1="350" x2="700" y2="450" />
    <line x1="700" y1="450" x2="900" y2="300" />
    <line x1="900" y1="300" x2="850" y2="100" />
  </g>

  <g fill="#4EB578" fill-opacity="0.4">
    <circle cx="100" cy="100" r="6" />
    <circle cx="300" cy="200" r="8" />
    <circle cx="250" cy="400" r="6" />
    <circle cx="500" cy="350" r="10" />
    <circle cx="700" cy="450" r="8" />
    <circle cx="900" cy="300" r="12" />
    <circle cx="850" cy="100" r="6" />
  </g>

  <!-- Central Branding Elements -->
  <rect x="350" y="200" width="500" height="200" rx="20" fill="white" fill-opacity="0.8" />
  <rect x="350" y="200" width="500" height="200" rx="20" stroke="#4EB578" stroke-width="2" stroke-opacity="0.1" />
  
  <text x="600" y="290" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#4EB578" text-anchor="middle">TECH UNIVERSITY</text>
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="20" fill="#6c757d" text-anchor="middle">Where Innovation Meets Excellence</text>

  <!-- Decorative Modern Shapes -->
  <path d="M1100 0 L1200 0 L1200 100 Z" fill="#4EB578" fill-opacity="0.1" />
  <path d="M0 500 L0 600 L100 600 Z" fill="#4EB578" fill-opacity="0.1" />
</svg>
