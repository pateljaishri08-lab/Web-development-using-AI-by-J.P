<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone Calculator UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <div class="brand" aria-hidden="true">Aurora Calculator</div>
      <section class="calculator" aria-label="Calculator">
        <div class="display" aria-label="Calculator display">
          <div class="display__top" aria-hidden="true"></div>
          <div class="display__value" id="display" role="status" aria-live="polite">0</div>
        </div>

        <div class="keys" role="group" aria-label="Calculator keys">
          <button class="key key--utility" type="button" data-action="clear" aria-label="All Clear">
            AC
          </button>
          <button class="key key--utility" type="button" data-action="sign" aria-label="Plus or minus">
            ±
          </button>
          <button class="key key--utility" type="button" data-action="percent" aria-label="Percent">%</button>
          <button class="key key--op" type="button" data-action="op" data-op="÷" aria-label="Divide">÷</button>

          <button class="key key--num" type="button" data-action="digit" data-digit="7" aria-label="Seven">7</button>
          <button class="key key--num" type="button" data-action="digit" data-digit="8" aria-label="Eight">8</button>
          <button class="key key--num" type="button" data-action="digit" data-digit="9" aria-label="Nine">9</button>
          <button class="key key--op" type="button" data-action="op" data-op="×" aria-label="Multiply">×</button>

          <button class="key key--num" type="button" data-action="digit" data-digit="4" aria-label="Four">4</button>
          <button class="key key--num" type="button" data-action="digit" data-digit="5" aria-label="Five">5</button>
          <button class="key key--num" type="button" data-action="digit" data-digit="6" aria-label="Six">6</button>
          <button class="key key--op" type="button" data-action="op" data-op="−" aria-label="Minus">−</button>

          <button class="key key--num" type="button" data-action="digit" data-digit="1" aria-label="One">1</button>
          <button class="key key--num" type="button" data-action="digit" data-digit="2" aria-label="Two">2</button>
          <button class="key key--num" type="button" data-action="digit" data-digit="3" aria-label="Three">3</button>
          <button class="key key--op" type="button" data-action="op" data-op="+" aria-label="Plus">+</button>

          <button class="key key--num key--zero" type="button" data-action="digit" data-digit="0" aria-label="Zero">
            0
          </button>
          <button class="key key--num" type="button" data-action="decimal" aria-label="Decimal point">
            .
          </button>
          <button class="key key--op" type="button" data-action="equals" aria-label="Equals">=</button>
        </div>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
