

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered Lists</title>
</head>
<body>

    <div>
        <!-- Heading above the lists -->
        <h2>My Favorite Things</h2>

        <!-- First unordered list -->
        <ul>
            <li>Reading</li>
            <li>Traveling</li>
            <li>Cooking</li>
        </ul>

        <!-- Second unordered list -->
        <ul>
            <li>Football</li>
            <li>Cricket</li>
            <li>Badminton</li>
        </ul>

        <!-- Third unordered list -->
        <ul>
            <li>Pizza</li>
            <li>Burger</li>
            <li>Pasta</li>
        </ul>

        <!-- Fourth unordered list -->
        <ul>
            <li>Java</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ul>

        <!-- Fifth unordered list -->
        <ul>
            <li>Google</li>
            <li>Facebook</li>
            <li>Twitter</li>
        </ul>

        <!-- Sixth unordered list -->
        <ul>
            <li>Red</li>
            <li>Blue</li>
            <li>Green</li>
        </ul>

        <!-- Seventh unordered list -->
        <ul>
            <li>Dog</li>
            <li>Cat</li>
            <li>Bird</li>
        </ul>
    </div>

</body>
</html>
