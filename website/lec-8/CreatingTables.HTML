

<!DOCTYPE html> <!-- Declares the document type as HTML5 -->
<html> <!-- Root element of the HTML page -->

<head> <!-- Head section containing metadata -->
    <title>User Table</title> <!-- Title of the webpage -->
</head>

<body> <!-- Body section where content is displayed -->

    <div> <!-- Container div for the table -->

        <table border="1"> <!-- Table with border -->

            <tr> <!-- Table row for headers -->
                <th>Name</th> <!-- Header for Name -->
                <th>Email</th> <!-- Header for Email -->
                <th>Age</th> <!-- Header for Age -->
            </tr>

            <tr> <!-- First user row -->
                <td>John Doe</td> <!-- User 1 Name -->
                <td>john@example.com</td> <!-- User 1 Email -->
                <td>25</td> <!-- User 1 Age -->
            </tr>

            <tr> <!-- Second user row -->
                <td>Jane Smith</td> <!-- User 2 Name -->
                <td>jane@example.com</td> <!-- User 2 Email -->
                <td>28</td> <!-- User 2 Age -->
            </tr>

            <tr> <!-- Third user row -->
                <td>Mike Johnson</td> <!-- User 3 Name -->
                <td>mike@example.com</td> <!-- User 3 Email -->
                <td>30</td> <!-- User 3 Age -->
            </tr>

        </table> <!-- End of table -->

    </div> <!-- End of div -->

</body> <!-- End of body -->

</html> <!-- End of HTML document -->
