

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Introduction</title>

    <style>
        /* Internal CSS */
        .colorOne {
            color: blue;
            font-size: 18px;
        }

        #colorTwo {
            color: green;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <!-- Inline CSS -->
    <p>Inline CSS</p>
    <p style="color: red; font-size: 20px;">
        This is a paragraph with inline CSS
    </p>

    <!-- Internal CSS -->
    <p>Internal CSS</p>
    <p class="colorOne">
        This is a paragraph with internal CSS (class)
    </p>

    <p id="colorTwo">
        This is a paragraph with internal CSS (id)
    </p>

</body>
</html>
