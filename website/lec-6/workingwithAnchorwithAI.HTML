

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple HTML Page</title>
</head>
<body>

    <!-- Main container div -->
    <div>
        
        <!-- Heading -->
        <h1 id="top">Welcome to My Webpage</h1>
        
        <!-- Paragraph -->
        <p>This is a simple HTML page demonstrating different types of links.</p>

        <!-- Link that opens Google in a new tab -->
        <p>
            <a href="https://www.google.com" target="_blank">
                Visit Google (opens in new tab)
            </a>
        </p>

        <!-- Link to another page (different page) -->
        <p>
            <a href="about.html">
                Go to About Page (different page)
            </a>
        </p>

        <!-- Link to a section on the same page -->
        <p>
            <a href="#bottom">
                Go to Bottom of this Page (same page link)
            </a>
        </p>

    </div>

    <!-- Some extra space to demonstrate scrolling -->
    <br><br><br><br><br><br><br><br><br><br>

    <!-- Target section for same page link -->
    <h2 id="bottom">You reached the bottom!</h2>

    <!-- Link back to top -->
    <p>
        <a href="#top">Back to Top</a>
    </p>

</body>
</html>
